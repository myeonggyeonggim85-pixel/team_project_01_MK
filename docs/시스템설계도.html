<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중고거래 피해 대응 길잡이 — 시스템 설계도</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 색은 docs/디자인시스템/helpos-design-system.md (남색 크롬 · 그린 포인트 · 회색 면) */
  :root { --navy: #1C2858; --text: #333333; --muted: #585D72; --soft: #686868; --rule: #CCCCCC; }
  @page { size: A4 portrait; margin: 10mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #FFFFFF; color: var(--text); font-family: 'Noto Sans KR', sans-serif; }
  .page { max-width: 794px; margin: 0 auto; padding: 24px 16px; }
  .eyebrow { font-size: 12px; font-weight: 500; color: var(--soft); margin: 0 0 4px; }
  h1 { font: 700 22px/1.35 'Noto Sans KR', sans-serif; color: var(--navy); margin: 0; }
  .sub { font-size: 12px; line-height: 1.6; color: var(--muted); margin: 4px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  svg { display: block; width: 100%; height: auto; }
  @media print {
    .page { padding: 0; max-width: none; break-inside: avoid; }
    svg { max-height: 246mm; }
  }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">시스템 설계도 · 1차 완료본 · 2026-11-19</p>
  <h1>중고거래 피해 대응 길잡이 — 시스템 설계도</h1>
  <p class="sub">피해자가 화면에 입력한 내용이 위에서 아래로 ① 화면 → ② 길잡이 서버 → ③ 바깥 서비스·자료로 전달되고, 답은 같은 길로 화면에 돌아옵니다. 사기인지 분쟁인지는 AI가 아니라 화면 안의 <b>분류 기준표</b>가 정합니다.</p>

<svg viewBox="0 0 760 1020" role="img" aria-labelledby="system-design-title system-design-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="system-design-title">중고거래 피해 대응 길잡이 시스템 설계도</title>
  <desc id="system-design-desc">피해자가 상담 화면에서 입력하면 화면 안의 분류 기준표가 결과를 정하고, 길잡이 서버가 AI(1·2·3순위), 공공기관 안내 문서, 국가법령정보센터와 국민참여입법센터에서 필요한 내용을 받아 오며, 연결이 안 되면 예시 값으로 대신하는 구조를 보여 줍니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#585D72"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2260A6"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- ===== 구역 ===== -->
  <g font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="700" fill="#585D72" text-anchor="middle">
    <rect x="20" y="128" width="720" height="136" rx="8" fill="rgba(28,40,88,0.03)" stroke="rgba(28,40,88,0.16)" stroke-width="0.8"/>
    <rect x="32" y="132" width="96" height="16" rx="2" fill="#FFFFFF"/>
    <text x="80" y="144">① 이용자 화면</text>

    <rect x="20" y="312" width="720" height="156" rx="8" fill="rgba(28,40,88,0.03)" stroke="rgba(28,40,88,0.16)" stroke-width="0.8"/>
    <rect x="32" y="316" width="96" height="16" rx="2" fill="#FFFFFF"/>
    <text x="80" y="328">② 길잡이 서버</text>

    <rect x="20" y="528" width="720" height="388" rx="8" fill="rgba(28,40,88,0.03)" stroke="rgba(28,40,88,0.16)" stroke-width="0.8"/>
    <rect x="456" y="532" width="128" height="16" rx="2" fill="#FFFFFF"/>
    <text x="520" y="544">③ 바깥 서비스 · 자료</text>
  </g>

  <!-- ===== 화살표 (상자보다 먼저) ===== -->
  <g fill="none" stroke-width="1.2">
    <path d="M360,80 V96 Q360,104 352,104 H198 Q190,104 190,112 V164" stroke="#585D72" marker-end="url(#arrow)"/>
    <line x1="340" y1="184" x2="420" y2="184" stroke="#585D72" marker-end="url(#arrow)"/>
    <line x1="420" y1="216" x2="340" y2="216" stroke="#585D72" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="140" y1="244" x2="140" y2="368" stroke="#2260A6" marker-end="url(#arrow-link)"/>
    <path d="M300,244 V288 Q300,296 308,296 H372 Q380,296 380,304 V368" stroke="#2260A6" marker-end="url(#arrow-link)"/>
    <path d="M320,244 V272 Q320,280 328,280 H612 Q620,280 620,288 V368" stroke="#2260A6" marker-end="url(#arrow-link)"/>
    <line x1="100" y1="448" x2="100" y2="576" stroke="#2260A6" marker-end="url(#arrow-link)"/>
    <path d="M300,448 V500 Q300,508 292,508 H188 Q180,508 180,516 V576" stroke="#2260A6" marker-end="url(#arrow-link)"/>
    <line x1="420" y1="448" x2="420" y2="576" stroke="#585D72" marker-end="url(#arrow)"/>
    <line x1="620" y1="448" x2="620" y2="576" stroke="#2260A6" marker-end="url(#arrow-link)"/>
    <path d="M720,408 H724 Q732,408 732,416 V728 Q732,736 724,736 H720" stroke="#2260A6" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
    <line x1="140" y1="656" x2="140" y2="696" stroke="#585D72" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="140" y1="776" x2="140" y2="816" stroke="#585D72" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="240" y1="856" x2="320" y2="856" stroke="#585D72" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== 화살표 이름표 ===== -->
  <g font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="500" fill="#585D72" text-anchor="middle">
    <rect x="224" y="82" width="104" height="16" rx="2" fill="#FFFFFF"/><text x="276" y="94">버튼 · 글 입력</text>
    <rect x="344" y="162" width="72" height="16" rx="2" fill="#FFFFFF"/><text x="380" y="174">정리된 사실</text>
    <rect x="348" y="222" width="64" height="16" rx="2" fill="#FFFFFF"/><text x="380" y="234">분류 결과</text>
    <rect x="148" y="272" width="48" height="16" rx="2" fill="#FFFFFF"/><text x="172" y="284">쓴 글</text>
    <rect x="388" y="320" width="64" height="16" rx="2" fill="#FFFFFF"/><text x="420" y="332">추가 질문</text>
    <rect x="628" y="312" width="80" height="16" rx="2" fill="#FFFFFF"/><text x="668" y="324">법 조문 요청</text>
    <rect x="108" y="484" width="68" height="16" rx="2" fill="#FFFFFF"/><text x="142" y="496">AI에 부탁</text>
    <rect x="428" y="484" width="48" height="16" rx="2" fill="#FFFFFF"/><text x="452" y="496">찾아봄</text>
    <rect x="628" y="484" width="56" height="16" rx="2" fill="#FFFFFF"/><text x="656" y="496">받아 옴</text>
    <rect x="148" y="668" width="56" height="16" rx="2" fill="#FFFFFF"/><text x="176" y="680">안 되면</text>
    <rect x="148" y="788" width="56" height="16" rx="2" fill="#FFFFFF"/><text x="176" y="800">안 되면</text>
    <rect x="244" y="832" width="72" height="16" rx="2" fill="#FFFFFF"/><text x="280" y="844">모두 안 됨</text>
  </g>

  <!-- ===== 상자: 이름(굵게) + 쉬운 설명 두 줄 ===== -->
  <g font-family="'Noto Sans KR', sans-serif" text-anchor="middle">
    <!-- 피해자 -->
    <rect x="280" y="16" width="200" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="280" y="16" width="200" height="64" rx="6" fill="rgba(88,93,114,0.10)" stroke="#686868" stroke-width="1"/>
    <text x="380" y="44" font-size="16" font-weight="700" fill="#1C2858">피해자</text>
    <text x="380" y="64" font-size="12" fill="#585D72">휴대폰이나 PC로 접속</text>

    <!-- 상담 화면 -->
    <rect x="40" y="164" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#1C2858" stroke-width="1"/>
    <text x="190" y="194" font-size="16" font-weight="700" fill="#1C2858">상담 화면</text>
    <text x="190" y="216" font-size="12" fill="#585D72">버튼을 누르거나 상황을 글로 씀</text>
    <text x="190" y="234" font-size="12" fill="#585D72">결과 · 증거 정리표 · 109 안내</text>

    <!-- 분류 기준표 (핵심) -->
    <rect x="420" y="164" width="300" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="420" y="164" width="300" height="80" rx="6" fill="rgba(88,191,62,0.12)" stroke="#328B1B" stroke-width="1.2"/>
    <text x="570" y="194" font-size="16" font-weight="700" fill="#1C2858">분류 기준표</text>
    <text x="570" y="216" font-size="12" fill="#585D72">사기 · 분쟁 · 수법을 정해진 기준으로 판단</text>
    <text x="570" y="234" font-size="12" fill="#585D72">AI는 판단하지 않음</text>

    <!-- 서버: 글 정리 -->
    <rect x="40" y="368" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#1C2858" stroke-width="1"/>
    <text x="140" y="398" font-size="16" font-weight="700" fill="#1C2858">글 정리</text>
    <text x="140" y="420" font-size="12" fill="#585D72">쓴 글을 사실 항목으로 정리</text>
    <text x="140" y="438" font-size="12" fill="#585D72">예: 돈을 보냈나, 받았나</text>

    <!-- 서버: 추가 질문 답변 -->
    <rect x="280" y="368" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#1C2858" stroke-width="1"/>
    <text x="380" y="398" font-size="16" font-weight="700" fill="#1C2858">추가 질문 답변</text>
    <text x="380" y="420" font-size="12" fill="#585D72">기관 절차를 물으면 답함</text>
    <text x="380" y="438" font-size="12" fill="#585D72">안내 문서에 있는 내용만</text>

    <!-- 서버: 관련 법 조문 -->
    <rect x="520" y="368" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#1C2858" stroke-width="1"/>
    <text x="620" y="398" font-size="16" font-weight="700" fill="#1C2858">관련 법 조문</text>
    <text x="620" y="420" font-size="12" fill="#585D72">최신 법 조문을 불러옴</text>
    <text x="620" y="438" font-size="12" fill="#585D72">시행일 · 바뀐 이력 포함</text>

    <!-- AI 1순위 -->
    <rect x="40" y="576" width="200" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="40" y="576" width="200" height="80" rx="6" fill="rgba(28,40,88,0.03)" stroke="rgba(28,40,88,0.30)" stroke-width="1"/>
    <text x="140" y="606" font-size="16" font-weight="700" fill="#1C2858">AI 1순위 (Claude)</text>
    <text x="140" y="628" font-size="12" fill="#585D72">글 정리 · 질문 답변을 도움</text>
    <text x="140" y="646" font-size="12" fill="#585D72">안 되면 다음 AI로 넘김</text>

    <!-- 공공기관 안내 문서 -->
    <rect x="280" y="576" width="200" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="280" y="576" width="200" height="80" rx="6" fill="rgba(28,40,88,0.05)" stroke="#585D72" stroke-width="1"/>
    <text x="380" y="606" font-size="16" font-weight="700" fill="#1C2858">공공기관 안내 문서</text>
    <text x="380" y="628" font-size="12" fill="#585D72">94개 조각으로 나눠 보관</text>
    <text x="380" y="646" font-size="12" fill="#585D72">답변의 근거로만 사용</text>

    <!-- 국가법령정보센터 -->
    <rect x="520" y="576" width="200" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="520" y="576" width="200" height="80" rx="6" fill="rgba(28,40,88,0.03)" stroke="rgba(28,40,88,0.30)" stroke-width="1"/>
    <text x="620" y="606" font-size="16" font-weight="700" fill="#1C2858">국가법령정보센터</text>
    <text x="620" y="628" font-size="12" fill="#585D72">법제처의 법령 자료</text>
    <text x="620" y="646" font-size="12" fill="#585D72">실시간으로 받아 옴</text>

    <!-- AI 2순위 -->
    <rect x="40" y="696" width="200" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="40" y="696" width="200" height="80" rx="6" fill="rgba(28,40,88,0.03)" stroke="rgba(28,40,88,0.30)" stroke-width="1"/>
    <text x="140" y="726" font-size="16" font-weight="700" fill="#1C2858">AI 2순위 (Groq)</text>
    <text x="140" y="748" font-size="12" fill="#585D72">1순위가 안 될 때 사용</text>
    <text x="140" y="766" font-size="12" fill="#585D72">어느 AI가 답했는지 표시</text>

    <!-- 국민참여입법센터 (없을 수도 있음) -->
    <rect x="520" y="696" width="200" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="520" y="696" width="200" height="80" rx="6" fill="rgba(28,40,88,0.02)" stroke="rgba(28,40,88,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="620" y="726" font-size="16" font-weight="700" fill="#1C2858">국민참여입법센터</text>
    <text x="620" y="748" font-size="12" fill="#585D72">진행 중인 법 개정 예고</text>
    <text x="620" y="766" font-size="12" fill="#585D72">이용 키가 없어 예시로 표시</text>

    <!-- AI 3순위 -->
    <rect x="40" y="816" width="200" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="40" y="816" width="200" height="80" rx="6" fill="rgba(28,40,88,0.03)" stroke="rgba(28,40,88,0.30)" stroke-width="1"/>
    <text x="140" y="846" font-size="16" font-weight="700" fill="#1C2858">AI 3순위 (Gemini)</text>
    <text x="140" y="868" font-size="12" fill="#585D72">2순위도 안 될 때 사용</text>
    <text x="140" y="886" font-size="12" fill="#585D72">세 AI의 역할은 같음</text>

    <!-- 예시 값으로 대신 -->
    <rect x="320" y="816" width="200" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="320" y="816" width="200" height="80" rx="6" fill="rgba(28,40,88,0.05)" stroke="#585D72" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="420" y="846" font-size="16" font-weight="700" fill="#1C2858">예시 값으로 대신</text>
    <text x="420" y="868" font-size="12" fill="#585D72">AI · 법령 연결이 안 될 때</text>
    <text x="420" y="886" font-size="12" fill="#585D72">상담이 끊기지 않게 함</text>
  </g>

  <!-- ===== 범례 (아래 가로 띠) ===== -->
  <line x1="20" y1="932" x2="740" y2="932" stroke="rgba(28,40,88,0.12)" stroke-width="0.8"/>
  <g font-family="'Noto Sans KR', sans-serif" font-size="12" fill="#585D72">
    <text x="20" y="956" font-weight="700" fill="#1C2858">보는 법</text>
    <rect x="80" y="946" width="16" height="12" rx="2" fill="rgba(88,93,114,0.10)" stroke="#686868" stroke-width="0.8"/><text x="104" y="956">이용자</text>
    <rect x="156" y="946" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#1C2858" stroke-width="0.8"/><text x="180" y="956">화면 · 서버</text>
    <rect x="264" y="946" width="16" height="12" rx="2" fill="rgba(88,191,62,0.12)" stroke="#328B1B" stroke-width="0.8"/><text x="288" y="956">핵심(분류 기준)</text>
    <rect x="400" y="946" width="16" height="12" rx="2" fill="rgba(28,40,88,0.05)" stroke="#585D72" stroke-width="0.8"/><text x="424" y="956">보관 자료</text>
    <rect x="500" y="946" width="16" height="12" rx="2" fill="rgba(28,40,88,0.03)" stroke="rgba(28,40,88,0.30)" stroke-width="0.8"/><text x="524" y="956">바깥 서비스</text>
    <rect x="616" y="946" width="16" height="12" rx="2" fill="none" stroke="rgba(28,40,88,0.30)" stroke-width="0.8" stroke-dasharray="3,2"/><text x="640" y="956">점선: 대신 · 선택</text>

    <line x1="80" y1="980" x2="112" y2="980" stroke="#2260A6" stroke-width="1.2" marker-end="url(#arrow-link)"/><text x="120" y="984">인터넷으로 요청</text>
    <line x1="240" y1="980" x2="272" y2="980" stroke="#585D72" stroke-width="1.2" marker-end="url(#arrow)"/><text x="280" y="984">안에서 전달</text>
    <line x1="376" y1="980" x2="408" y2="980" stroke="#585D72" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text x="416" y="984">결과를 돌려줌 · 안 되면 다음으로</text>

    <text x="20" y="1012" fill="#686868">모든 요청 공통: 계좌번호 · 연락처는 가린 뒤 AI에 보냄 · 한 사람당 10분에 30번까지 · 비밀 키는 서버에만 보관</text>
  </g>
</svg>
</div>
</body>
</html>
